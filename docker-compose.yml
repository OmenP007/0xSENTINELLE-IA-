version: '3.8'

services:
  # Backend API FastAPI
  backend:
    build: .
    container_name: 0xsentinelle_api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  # Bot Telegram 0xSentinelle
  telegram_bot:
    build: .
    container_name: 0xsentinelle_telegram_bot
    restart: always
    env_file:
      - .env
    command: python backend/telegram_bot.py
